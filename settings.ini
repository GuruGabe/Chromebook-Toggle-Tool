[Settings]
# Chromebook Toggle Tool - settings. Edit this file with Notepad; no rebuild
# is needed, just restart the app. Lines that start with # are comments.
# (Keep to plain English letters, digits and punctuation: the app reads this
# file as plain ASCII, and anything else makes it ignore the whole file.)

# Full path to GAM's program (gam.exe) on THIS PC.
gam_path = C:\GAM7\gam.exe

# The Google Workspace account GAM uses to READ a Google Sheet (Google Sheet
# input only - typed serials and CSV files never use it). It ships as a
# placeholder that will NOT work: change it to a real account in your own
# domain, and share every sheet you want to use with that same account.
sheet_acting_email = gam-admin@example.com

# The heading of the column that holds the serial numbers in a GOOGLE SHEET.
# GAM's own download of Chromebooks calls it serialNumber, so that is the
# default. GAM matches it EXACTLY (capital letters count). The window also has
# a Serial column box you can change for one run. (CSV files are different:
# the app finds a Serial / SerialNumber column by itself.)
serial_column = serialNumber

# Whether the permanent DEPROVISION action is offered at all. A deprovisioned
# Chromebook is removed from management and has to be wiped and re-enrolled
# to be used again, so it is OFF by default: set this to true only on PCs
# used by people who are meant to retire devices. (Even when true, every
# deprovision still requires typing a confirmation word.)
# To change it later WITHOUT reinstalling, an administrator can run the program
# once with  --set-deprovision on  (or off / clear); that sets a machine-wide
# policy which OVERRIDES this line. See README.txt.
allow_deprovision = false

# Whether the app looks for a newer release by itself when it starts (at
# most once a day; it never installs anything without asking first).
# Help > Check for updates now always works. Set to false to stop the
# automatic check, for example on a PC with no internet access.
check_for_updates = true

# Where releases are published. Only change these for a fork or a mirror.
#update_repo = GuruGabe/Chromebook-Toggle-Tool
#update_api_base = https://api.github.com
